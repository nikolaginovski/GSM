  <style>
    :root {
      --bg: #050814;
      --card: #0f172a;
      --accent: #e5e7eb;
      --muted: #9ca3af;
      --border-subtle: rgba(148,163,184,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 50%, #000 100%);
      color: var(--accent);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 12px 40px;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .btn {
      border-radius: 999px;
      padding: 6px 14px;
      border: 1px solid var(--border-subtle);
      background: #020617;
      color: var(--accent);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn.primary {
      background: #e5e7eb;
      color: #020617;
      border-color: transparent;
    }

    .btn:hover {
      border-color: #e5e7eb;
    }

    .card {
      background: #020617;
      border-radius: 24px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    }

    @media (max-width: 820px) {
      .card {
        grid-template-columns: minmax(0,1fr);
      }
    }

    .image-wrap {
      background: #020617;
      border-right: 1px solid var(--border-subtle);
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 20px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    h1 {
      font-size: 1.5rem;
    }

    p {
      font-size: 0.93rem;
      color: var(--muted);
    }

    ul {
      margin: 6px 0 0;
      padding-left: 18px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .meta {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .meta span {
      display: inline-block;
      margin-right: 10px;
    }

    .buttons {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .not-found {
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }
  </style>
</head>

            "Comfortable height for casual seating"
          ],
        },
      },
    };

    let currentLang = "mk";

    function render() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("item");
      const data = ITEMS[id];
      const root = document.getElementById("root");

      if (!data) {
        root.innerHTML = `
          <div class="card">
            <div class="not-found">
              <h2>Артиклот не е пронајден</h2>
              <p>Овој артикл не постои или е тргнат.</p>
              <div style="margin-top:12px;">
                <a class="btn" href="index.html">← Назад до галерија</a>
              </div>
            </div>
          </div>
        `;
        return;
      }

      const t = data[currentLang];

      root.innerHTML = `
        <div class="card">
          <div class="image-wrap">
            <img src="${data.image}" alt="${t.title}">
          </div>
          <div class="content">
            <div class="badge">${t.category}</div>
            <h1>${t.title}</h1>
            <p>${t.description}</p>
            ${
              t.details && t.details.length
                ? `<ul>${t.details.map(d => `<li>${d}</li>`).join("")}</ul>`
                : ""
            }
            <div class="meta">
              <span>${
                currentLang === "mk"
                  ? "Производ од Ginovski Metallic Studio"
                  : "Custom fabrication by Ginovski Metallic Studio"
              }</span>
            </div>
            <div class="buttons">
              <a class="btn primary" href="tel:+38975744244">${
                currentLang === "mk" ? "Јави се на Златко" : "Call Zlatko"
              }</a>
              <a class="btn" href="mailto:?subject=${
                currentLang === "mk"
                  ? encodeURIComponent("Прашање за: " + t.title)
                  : encodeURIComponent("Inquiry about: " + t.title)
              }">${
                currentLang === "mk"
                  ? "Испрати e-mail за овој артикл"
                  : "Email about this item"
              }</a>
              <a class="btn" href="index.html">${
                currentLang === "mk" ? "← Назад до галерија" : "← Back to gallery"
              }</a>
            </div>
          </div>
        </div>
      `;
    }

    function applyItemLanguage(lang) {
      currentLang = lang;
      const toggle = document.getElementById("langToggle");
      const brandTitle = document.getElementById("brandTitle");

      toggle.textContent = lang === "mk" ? "EN" : "MK";
      brandTitle.textContent =
        lang === "mk" ? "Гиновски Металик Студио" : "Ginovski Metallic Studio";

      render();
    }

    document.addEventListener("DOMContentLoaded", () => {
      applyItemLanguage("mk");
      document.getElementById("langToggle").addEventListener("click", () => {
        applyItemLanguage(currentLang === "mk" ? "en" : "mk");
      });
    });
  </script>
</body>
</html>
