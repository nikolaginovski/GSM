<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #050814;
      --card: #0f172a;
      --accent: #e5e7eb;
      --muted: #9ca3af;
      --border-subtle: rgba(148,163,184,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 50%, #000 100%);
      color: var(--accent);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
    }

    .card {
      max-width: 900px;
      width: 100%;
      background: #020617;
      border-radius: 24px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    }

    @media (max-width: 820px) {
      .card {
        grid-template-columns: minmax(0,1fr);
      }
    }

    .image-wrap {
      background: #020617;
      border-right: 1px solid var(--border-subtle);
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 20px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    h1 {
      font-size: 1.5rem;
    }

    p {
      font-size: 0.93rem;
      color: var(--muted);
    }

    ul {
      margin: 6px 0 0;
      padding-left: 18px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .meta {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .meta span {
      display: inline-block;
      margin-right: 10px;
    }

    .buttons {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      border-radius: 999px;
      padding: 8px 16px;
      border: 1px solid var(--border-subtle);
      background: #020617;
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
    }

    .btn.primary {
      background: #e5e7eb;
      color: #020617;
      border-color: transparent;
    }

    .btn:hover {
      border-color: #e5e7eb;
    }

    .not-found {
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }
  </style>
</head>

    function render() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("item");
      const data = ITEMS[id];

      const root = document.getElementById("root");

      if (!data) {
        root.innerHTML = `
          <div class="card">
            <div class="not-found">
              <h2>Item not found</h2>
              <p>This item does not exist or was removed.</p>
              <div style="margin-top:12px;">
                <a class="btn" href="index.html">← Back to gallery</a>
              </div>
            </div>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="card">
          <div class="image-wrap">
            <img src="${data.image}" alt="${data.title}">
          </div>
          <div class="content">
            <div class="badge">${data.category}</div>
            <h1>${data.title}</h1>
            <p>${data.description}</p>
            ${
              data.details && data.details.length
                ? `<ul>${data.details.map(d => `<li>${d}</li>`).join("")}</ul>`
                : ""
            }
            <div class="meta">
              <span>Custom fabrication by Ginovski Metallic Studio</span>
            </div>
            <div class="buttons">
              <a class="btn primary" href="tel:+38975744244">Call Zlatko</a>
              <a class="btn" href="mailto:?subject=Inquiry%20about%20${encodeURIComponent(

              )}">Email about this item</a>
              <a class="btn" href="index.html" target="_self">← Back to gallery</a>
            </div>
          </div>
        </div>
      `;
